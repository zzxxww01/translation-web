name: Prompt review source snapshot

on:
  push:
    branches: ["fix/chinese-prompt-quality-v2"]
    paths: [".github/workflows/prompt-review-snapshot.yml"]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked code for isolated review
        run: |
          git archive --format=tar.gz --output=prompt-review-source.tar.gz HEAD src tests config glossary glossary_new scripts web/frontend requirements.txt requirements-dev.txt pytest.ini .github
          git rev-parse HEAD > snapshot-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-review-source
          path: |
            prompt-review-source.tar.gz
            snapshot-commit.txt
          retention-days: 1
