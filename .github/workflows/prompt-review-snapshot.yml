name: Prompt review dependencies

on:
  push:
    branches: ["fix/chinese-prompt-quality-v2"]
    paths: [".github/workflows/prompt-review-snapshot.yml"]

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download public wheels for offline tests
        run: |
          python -m pip download --only-binary=:all: --dest wheels openai python-slugify slowapi portalocker premailer google-genai==1.66.0 pytest-asyncio
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-review-deps
          path: wheels
          retention-days: 1
