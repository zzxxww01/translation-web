name: Verify and publish persistence audit fixes
on:
  push:
    branches: ["fix/chinese-prompt-quality-v2"]
    paths: [".github/workflows/apply-persistence-round4.yml"]
permissions:
  contents: write
concurrency:
  group: persistence-round4-publish
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: test
      VECTORENGINE_API_KEY: test
      RUN_LLM_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chinese-prompt-quality-v2
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact input files and integrate upstream fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          shas = ['538f7461f93f8cebdad415d009b8b9af010ce490', '5ef2ef3edf3835b43fafff31d7bc1e40384a9db4']
          chunks = []
          for sha in shas:
              value = json.loads(subprocess.check_output(['gh', 'api', f'repos/zzxxww01/translation-web/git/blobs/{sha}']))
              data = base64.b64decode(value['content'])
              assert blob(data) == sha, 'Transport blob mismatch'
              chunks.append(data)
          packed = b''.join(chunks)
          assert hashlib.sha256(packed).hexdigest() == 'c69e1cbe551382ea882b55d9d7790c0438b2ee539a24ab9091e57dbc73e8c769'
          package = json.loads(lzma.decompress(packed))
          assert package['schema'] == 1 and len(package['files']) == 22
          assert not git('status', '--porcelain'), 'Checkout is not clean'
          subprocess.run(['git', 'merge-base', '--is-ancestor', package['expected_branch_ancestor'], 'HEAD'], check=True)
          assert git('rev-parse', 'origin/main') == package['main_commit'], 'Main changed; reconcile first'
          upstream = set(git('diff', '--name-only', 'HEAD...origin/main').splitlines())
          assert upstream <= package['files'].keys(), 'Unreviewed upstream changes'
          root = pathlib.Path.cwd().resolve()
          prepared = {}
          for name, entry in package['files'].items():
              rel = pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts
              assert name.startswith(('src/', 'tests/', 'docs/'))
              path = root / rel
              assert not any(p.is_symlink() for p in [path, *path.parents])
              before = path.read_bytes() if path.exists() else b''
              if entry['before'] is None:
                  assert not path.exists(), f'New file conflicts: {name}'
              else:
                  assert blob(before) == entry['before'], f'Baseline changed: {name}'
              lines = before.decode('utf-8').splitlines(keepends=True)
              last_start = len(lines) + 1
              for start, end, text in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines) and end <= last_start
                  lines[start:end] = [text]
                  last_start = start
              result = ''.join(lines).encode('utf-8')
              assert blob(result) == entry['after'] and hashlib.sha256(result).hexdigest() == entry['sha256'], name
              prepared[path] = result
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          merged = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', package['main_commit']])
          assert merged.returncode in (0, 1), 'Unable to prepare upstream merge'
          assert git('rev-parse', 'MERGE_HEAD') == package['main_commit'], 'Expected upstream merge was not prepared'
          conflicts = set(git('diff', '--name-only', '--diff-filter=U').splitlines())
          assert conflicts <= package['files'].keys(), 'Unexpected conflicts'
          for path, data in prepared.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          subprocess.run(['git', 'add', '--', *package['files']], check=True)
          assert not git('diff', '--name-only', '--diff-filter=U'), 'Unresolved merge conflict'
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(package['files']), 'Unexpected staged paths'
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'persistence-manifest.json').write_text(json.dumps(package, ensure_ascii=False))
          print(f'Applied {len(prepared)} verified files; integrated all {len(upstream)} upstream paths')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify full backend before publishing
        run: |
          set -o pipefail
          python -m pip install -r requirements-dev.txt
          python -m compileall -q src
          python -c "from src.api.app import app; print('App import OK')"
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/persistence-backend-tests.log"
      - name: Publish verified merge to the existing repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          package = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'persistence-manifest.json').read_text())
          for name, entry in package['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == entry['sha256'], f'Source changed during tests: {name}'
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()
          assert set(staged) == set(package['files']), 'Unexpected staged paths'
          PY
          git diff --cached --check
          git commit -m 'fix: preserve durable translation state and integrate upstream title fixes'
          gh auth setup-git
          git push origin HEAD:fix/chinese-prompt-quality-v2
          git rev-parse HEAD | tee "$RUNNER_TEMP/persistence-published-commit.txt"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistence-round4-verification
          path: |
            ${{ runner.temp }}/persistence-*.json
            ${{ runner.temp }}/persistence-*.log
            ${{ runner.temp }}/persistence-published-commit.txt
          retention-days: 7
