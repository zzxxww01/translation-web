name: Prepare sanitizer regression dependencies
on:
  push:
    branches: ["fix/chinese-prompt-quality-v2"]
    paths: [".github/workflows/audit-round3-deps.yml"]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve new sanitizer without changing other direct version ranges
        working-directory: web/frontend
        run: |
          npm ci --ignore-scripts
          npm install --save-exact --ignore-scripts dompurify@3.4.15
          npm audit --json > "$RUNNER_TEMP/npm-sanitizer-audit.json"
          cp package.json package-lock.json "$RUNNER_TEMP/"
          tar -czf "$RUNNER_TEMP/frontend-node-modules.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: sanitizer-regression-dependencies
          path: |
            ${{ runner.temp }}/package.json
            ${{ runner.temp }}/package-lock.json
            ${{ runner.temp }}/npm-sanitizer-audit.json
            ${{ runner.temp }}/frontend-node-modules.tar.gz
          retention-days: 3
