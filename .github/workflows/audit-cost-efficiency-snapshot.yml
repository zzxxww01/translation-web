name: Cost and efficiency audit source
on:
  push:
    branches: ["fix/chinese-prompt-quality-v2"]
    paths: [".github/workflows/audit-cost-efficiency-snapshot.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked review sources
        run: |
          git archive --format=tar.gz --output=audit-source.tar.gz HEAD src tests config glossary glossary_new scripts web/frontend requirements.txt requirements-dev.txt pytest.ini .github docs translate-post slack-reply
          git rev-parse HEAD > source-commit.txt
          git ls-tree -r HEAD > source-blobs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cost-efficiency-audit-source
          path: |
            audit-source.tar.gz
            source-commit.txt
            source-blobs.txt
          retention-days: 3
