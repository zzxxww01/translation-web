name: Integration regression audit snapshot
on:
  push:
    branches: ["fix/chinese-prompt-quality-v2"]
    paths: [".github/workflows/audit-round3-snapshot.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked application and test source only
        run: |
          mkdir -p "$RUNNER_TEMP/audit-snapshot"
          python3 - <<'PY'
          import os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit-snapshot'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          roots = {'src','tests','config','scripts','web','.github','docs'}
          paths = [p for p in tracked if p and (p.split('/')[0] in roots or ('/' not in p and not p.startswith('.env') and not p.endswith('.log')))]
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),'HEAD','--',*paths], check=True)
          (out/'head-sha.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          (out/'tracked-blobs.txt').write_bytes(subprocess.check_output(['git','ls-tree','-r','HEAD']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: integration-audit-snapshot
          path: ${{ runner.temp }}/audit-snapshot
          retention-days: 3
