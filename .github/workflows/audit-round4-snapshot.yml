name: Continued audit source snapshot
on:
  push:
    branches: ["fix/chinese-prompt-quality-v2"]
    paths: [".github/workflows/audit-round4-snapshot.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked application source and revision metadata
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          git archive --format=tar.gz --output="$RUNNER_TEMP/audit/source.tar.gz" HEAD src tests config glossary glossary_new scripts web/frontend docs requirements.txt requirements-dev.txt requirements-lock.txt pytest.ini .github .gitignore README.md SECURITY.md Dockerfile docker-compose.yml start.sh stop.sh translate-post slack-reply
          git rev-parse HEAD > "$RUNNER_TEMP/audit/commit.txt"
          git rev-parse origin/main > "$RUNNER_TEMP/audit/main-commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/audit/tree.txt"
          git log --oneline -20 > "$RUNNER_TEMP/audit/recent-commits.txt"
          git diff HEAD...origin/main > "$RUNNER_TEMP/audit/main-changes.patch"
          git archive --format=tar.gz --output="$RUNNER_TEMP/audit/main-overlap.tar.gz" origin/main src/core/export_completeness.py tests/unit/services/test_export_completeness_attributions.py
      - uses: actions/upload-artifact@v4
        with:
          name: audit-round4-source
          path: ${{ runner.temp }}/audit
          retention-days: 3
