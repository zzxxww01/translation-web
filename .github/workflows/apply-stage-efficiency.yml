name: Verify and publish stage efficiency changes
on:
  push:
    branches: ["feat/stage-resume-cost-efficiency"]
    paths: [".github/workflows/apply-stage-efficiency.yml"]
permissions:
  contents: write
concurrency:
  group: publish-stage-efficiency
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: test
      VECTORENGINE_API_KEY: test
      RUN_LLM_TESTS: "0"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed files with baseline and result hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          shas = ['a9c36db03f186fbf22f9b8e189b447e8979879ac', '2b55fd0a4d09f58e7ab2eef8880d57c28211d67c', 'da2f7ff404aa488fd352ba11538a1afd2f1c40c7', '037967ae0eee495bcd285b63620da0a15be8a481']
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          chunks = []
          for sha in shas:
              value = json.loads(subprocess.check_output(['gh', 'api', f'repos/zzxxww01/translation-web/git/blobs/{sha}']))
              data = base64.b64decode(value['content'])
              assert blob(data) == sha, 'Transport blob mismatch'
              chunks.append(data)
          packed = b''.join(chunks)
          assert hashlib.sha256(packed).hexdigest() == '0231f0b0ef387066bb30b70457b7b3495238620ea8f7ba7a580e2edba8918de9'
          package = json.loads(lzma.decompress(packed))
          assert package['schema'] == 1 and len(package['files']) == 32
          assert package['expected_branch_head'] == '516817963d750298812e2d15d43de91c248a8795'
          subprocess.run(['git', 'merge-base', '--is-ancestor', package['expected_branch_head'], 'HEAD'], check=True)
          root = pathlib.Path.cwd().resolve()
          prepared = {}
          for name, entry in package['files'].items():
              rel = pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts
              assert name.startswith(('src/', 'tests/', 'web/frontend/', 'docs/'))
              path = root / rel
              assert not any(p.is_symlink() for p in [path, *path.parents])
              before = path.read_bytes() if path.exists() else b''
              if entry['before'] is None:
                  assert not path.exists(), f'New file conflict: {name}'
              else:
                  assert blob(before) == entry['before'], f'Baseline changed: {name}'
              lines = before.decode('utf-8').splitlines(keepends=True)
              last_start = len(lines) + 1
              for start, end, text in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines) and end <= last_start
                  lines[start:end] = [text]
                  last_start = start
              result = ''.join(lines).encode('utf-8')
              assert blob(result) == entry['after'] and hashlib.sha256(result).hexdigest() == entry['sha256'], name
              prepared[path] = result
          for path, data in prepared.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'stage-manifest.json').write_text(json.dumps(package['files'], ensure_ascii=False))
          print(f'Applied and hash-verified {len(prepared)} reviewed files')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify backend
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          if [ ! -f config/llm_providers.yaml ]; then cp config/llm_providers.yaml.example config/llm_providers.yaml; fi
          python -m compileall -q src
          python -c "from src.api.app import app; print('App import OK:', len(app.routes), 'routes')"
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/stage-backend-tests.log"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Verify frontend
        working-directory: web/frontend
        run: |
          set -euo pipefail
          npm ci
          npm run lint -- --max-warnings 0 2>&1 | tee "$RUNNER_TEMP/stage-frontend-lint.log"
          npm test 2>&1 | tee "$RUNNER_TEMP/stage-frontend-tests.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/stage-frontend-build.log"
          npm audit --json > "$RUNNER_TEMP/stage-npm-audit.json"
      - name: Install Chromium
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium
      - name: Verify browser flows without paid model calls
        run: |
          set -euo pipefail
          python -m uvicorn src.api.app:app --host 127.0.0.1 --port 54321 > "$RUNNER_TEMP/stage-browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:54321/api/health', timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Browser-test server did not become healthy')
          PY
          npm --prefix web/frontend run test:e2e -- --workers=2 2>&1 | tee "$RUNNER_TEMP/stage-browser-tests.log"
      - name: Publish only verified changes to the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          manifest = json.loads((temp / 'stage-manifest.json').read_text())
          audit = json.loads((temp / 'stage-npm-audit.json').read_text())
          assert not audit.get('error') and audit['metadata']['vulnerabilities']['total'] == 0
          for name, entry in manifest.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == entry['sha256'], f'Source changed during tests: {name}'
          subprocess.run(['git', 'add', '--', *manifest], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert set(staged) == set(manifest)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: resume verified translation stages and reduce repeated inference'
          gh auth setup-git
          git push origin HEAD:feat/stage-resume-cost-efficiency
          git rev-parse HEAD | tee "$RUNNER_TEMP/stage-published-commit.txt"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-efficiency-verification
          path: |
            ${{ runner.temp }}/stage-*.log
            ${{ runner.temp }}/stage-*.json
            ${{ runner.temp }}/stage-published-commit.txt
            /tmp/translation-agent-playwright
          retention-days: 7
