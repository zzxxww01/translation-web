name: Verify and publish deep quality fixes
on:
  push:
    branches: ["fix/chinese-prompt-quality-v2"]
    paths: [".github/workflows/publish-deep-quality.yml"]
permissions:
  contents: write
concurrency:
  group: deep-quality-publish
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: test
      VECTORENGINE_API_KEY: test
      RUN_LLM_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chinese-prompt-quality-v2
          fetch-depth: 0
          persist-credentials: false
      - name: Apply independently hash-verified changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          shas = [
              "71b6126037b55f8e102f811dd8ab5b867cd59be0",
              "212be2e6dcabcc92660044e40c6d827fcc20cabe",
              "978ff80864ffdc3af8cb98d0a97e420b5891774b",
              "201f88a5350d5c02aa7ae65244141c33bdc79df9",
              "e1fce8008ca2baa852501d74ad02446b0554a0e9",
              "82470759fffd5447500890fd3b7159376cf456b7",
          ]
          def blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          chunks = []
          for sha in shas:
              item = json.loads(subprocess.check_output(["gh", "api", f"repos/zzxxww01/translation-web/git/blobs/{sha}"]))
              data = base64.b64decode(item["content"])
              assert blob(data) == sha, "Transport chunk mismatch"
              chunks.append(data)
          packed = b"".join(chunks)
          assert hashlib.sha256(packed).hexdigest() == "352249d32592c7db3c44f74cc20db1129bbcdc7a20be363a97d69f858274df6f"
          package = json.loads(lzma.decompress(packed))
          assert package["schema"] == 1 and len(package["files"]) == 27
          subprocess.run(["git", "merge-base", "--is-ancestor", package["expected_branch_head"], "HEAD"], check=True)
          root = pathlib.Path.cwd().resolve()
          prepared = {}
          for name, entry in package["files"].items():
              rel = pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and ".." not in rel.parts
              assert name.startswith(("src/", "tests/", "web/frontend/")) or name == "docs/DEEP_QUALITY_AUDIT.md"
              path = root / rel
              assert not any(p.is_symlink() for p in [path, *path.parents])
              before = path.read_bytes() if path.exists() else b""
              if entry["before"] is None:
                  assert not path.exists(), f"New file conflict: {name}"
              else:
                  assert blob(before) == entry["before"], f"Baseline changed: {name}"
              lines = before.decode("utf-8").splitlines(keepends=True)
              last_start = len(lines) + 1
              for start, end, text in reversed(entry["edits"]):
                  assert 0 <= start <= end <= len(lines) and end <= last_start
                  lines[start:end] = [text]
                  last_start = start
              result = "".join(lines).encode("utf-8")
              assert blob(result) == entry["after"], f"Result blob mismatch: {name}"
              assert hashlib.sha256(result).hexdigest() == entry["sha256"]
              prepared[path] = result
          for path, data in prepared.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          (temp / "deep-manifest.json").write_text(json.dumps(package["files"], ensure_ascii=False))
          print(f"Verified and applied {len(prepared)} files")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip freeze > "$RUNNER_TEMP/resolved-requirements.txt"
      - name: Verify backend
        run: |
          set -o pipefail
          python -m compileall -q src
          python -c "from src.api.app import app; print('App import OK:', len(app.routes), 'routes')"
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/deep-backend-tests.log"
      - name: Audit resolved Python dependencies in an isolated tool environment
        continue-on-error: true
        run: |
          python -m venv "$RUNNER_TEMP/audit-tool"
          "$RUNNER_TEMP/audit-tool/bin/pip" install pip-audit==2.10.1
          "$RUNNER_TEMP/audit-tool/bin/pip-audit" -r "$RUNNER_TEMP/resolved-requirements.txt" --no-deps --disable-pip --progress-spinner off --format json --output "$RUNNER_TEMP/deep-python-audit.json"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci
      - name: Verify frontend
        working-directory: web/frontend
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$RUNNER_TEMP/deep-frontend-lint.log"
          npm test 2>&1 | tee "$RUNNER_TEMP/deep-frontend-tests.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/deep-frontend-build.log"
      - name: Audit JavaScript dependencies
        working-directory: web/frontend
        run: npm audit --json > "$RUNNER_TEMP/deep-npm-audit.json"
      - name: Validate audit completeness and publish tested files only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          npm = json.loads((temp / "deep-npm-audit.json").read_text())
          assert "error" not in npm and npm["metadata"]["vulnerabilities"]["total"] == 0
          audit = json.loads((temp / "deep-python-audit.json").read_text())
          assert audit.get("dependencies"), "Python audit did not cover any dependency"
          assert all("skip_reason" not in d and not d.get("vulns") for d in audit["dependencies"]), "Python audit has unresolved or skipped dependencies"
          manifest = json.loads((temp / "deep-manifest.json").read_text())
          for name, entry in manifest.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == entry["sha256"], name
          subprocess.run(["git", "add", "--", *manifest], check=True)
          staged = subprocess.check_output(["git", "diff", "--cached", "--name-only", "-z"]).decode().strip("\0").split("\0")
          assert set(staged) == set(manifest), "Unexpected staged paths"
          PY
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden review versions, resource fetching and rule snapshots"
          gh auth setup-git
          git push origin HEAD:fix/chinese-prompt-quality-v2
          git rev-parse HEAD | tee "$RUNNER_TEMP/deep-published-commit.txt"
      - name: Preserve verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-quality-verification
          path: |
            ${{ runner.temp }}/deep-*.log
            ${{ runner.temp }}/deep-*.json
            ${{ runner.temp }}/deep-published-commit.txt
            ${{ runner.temp }}/resolved-requirements.txt
          retention-days: 7
