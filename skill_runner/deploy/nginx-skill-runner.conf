# 放进 momo.beauty 的 server 块里（服务器上是 /etc/nginx/snippets/skill-runner-location.conf，再 include）。
# nginx 按最长前缀匹配 location，所以和已有的 location /api/ 谁先谁后都行。
location /api/skills/ {
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 事件流（SSE）：不缓冲，长连接。服务端每 15 秒发一次心跳
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # 上传边收边转发。公网入口是 Cloudflare Tunnel，免费版单个请求最大 100 MB，
    # 所以这里和 SKILL_RUNNER_MAX_UPLOAD_MB（95）都按这个上限来；更大的素材贴链接
    client_max_body_size 100m;
    proxy_request_buffering off;
}
