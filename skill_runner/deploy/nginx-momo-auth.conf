# 全站登录（2026-11-21）：翻译服务的 /api 和 /ws 共用 skill-runner 的口令登录。
# 服务器上是 /etc/nginx/snippets/momo-auth.conf，在 momo.beauty 的 server 块里 include，
# 另外在 location /api/ 和 location /ws/ 里各加两行：
#     auth_request /_momo_auth;
#     error_page 401 = @momo_unauthorized;
# /api/skills/ 是更长的前缀，走 skill-runner 自己的校验，不受影响。
# 服务器本机直接调 127.0.0.1:54321 的（translate-post、slack-reply、Muse 自动化）不经过 nginx，也不受影响。

location = /_momo_auth {
    internal;
    proxy_pass http://127.0.0.1:18090/api/skills/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
}

# 只对 auth_request 的 401 生效（没开 proxy_intercept_errors，后端自己的 401 原样返回）
location @momo_unauthorized {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"detail":"请先登录"}';
}

# 发版校验（scripts/verify_release.py）要从公网读的两个接口，只有版本号和健康状态，不拦
location = /api/health {
    proxy_pass http://translation_agent_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
}

location = /api/release {
    proxy_pass http://translation_agent_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
}
