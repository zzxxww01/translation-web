providers:
  gemini-official:
    type: gemini
    name: Gemini 官方 API
    description: Google 官方 API，稳定可靠
    group_priority: 2
    network:
      proxy_mode: disabled
    api_keys:
    - key: ${GEMINI_API_KEY}
      priority: 1
      name: 主 Key
    - key: ${GEMINI_BACKUP_API_KEY}
      priority: 2
      name: 备用 Key
    rate_limit:
      max_concurrent: 2
      requests_per_minute: 60
    models:
    - alias: gemini-flash-fallback
      real_model: gemini-2.5-flash
      name: Gemini 2.5 Flash
      description: 快速低成本
      priority: 2
      supports_thinking: false
      config:
        temperature: 0.7
        max_tokens: 8192
        timeout: 60
    - alias: gemini-pro-fallback
      real_model: gemini-3.1-pro-preview
      name: Gemini 3.1 Pro Preview
      description: 平衡质量与成本
      priority: 2
      supports_thinking: true
      config:
        temperature: 0.7
        max_tokens: 8192
        timeout: 120
    - alias: gemini-preview-fallback
      real_model: gemini-3.1-pro-preview
      name: Gemini 3.1 Pro Preview
      description: 预览版更强能力
      priority: 2
      supports_thinking: true
      config:
        temperature: 0.7
        max_tokens: 8192
        timeout: 120
    retry_config:
      max_retries: 5
      base_delay: 0.5
      max_delay: 16.0
      exponential_backoff: true
  vectorengine-relay:
    type: vectorengine
    name: RelayRouter 中转
    description: 高性价比中转服务
    group_priority: 1
    network:
      proxy_mode: disabled
    api_keys:
    - key: ${VECTORENGINE_API_KEY}
      priority: 1
      name: 主 Key
    - key: ${VECTORENGINE_BACKUP_API_KEY}
      priority: 2
      name: 备用 Key
    base_url: ${VECTORENGINE_BASE_URL}
    rate_limit:
      max_concurrent: 100
      requests_per_minute: 1000
    models:
    - alias: deepseek-v3
      real_model: deepseek-v4.1-flash
      name: DeepSeek V4.1 Flash
      description: 高性价比推理模型
      priority: 1
      supports_thinking: true
      config:
        temperature: 0.7
        max_tokens: 8192
        timeout: 120
    - alias: qwen-plus
      real_model: qwen3.6-plus
      name: Qwen 3.6 Plus
      description: 通义千问
      priority: 2
      supports_thinking: false
      config:
        temperature: 0.7
        max_tokens: 8192
        timeout: 120
    - alias: grok-4-1-fast-non-reasoning
      real_model: grok-4.7
      name: Grok 4.7
      description: xAI 模型
      priority: 3
      supports_thinking: false
      config:
        temperature: 0.7
        max_tokens: 8192
        timeout: 120
    - alias: gemini-flash
      real_model: gemini-3.8-flash
      name: Gemini 3.8 Flash
      description: 快速低成本
      priority: 2
      supports_thinking: false
      config:
        temperature: 0.7
        max_tokens: 8192
        timeout: 60
    - alias: gemini-pro
      real_model: gemini-3.8-flash
      name: Gemini 3.8 Flash
      description: 平衡质量与成本
      priority: 2
      supports_thinking: true
      config:
        temperature: 0.7
        max_tokens: 8192
        timeout: 120
    - alias: gemini-preview
      real_model: gemini-3.8-flash
      name: Gemini 3.8 Flash
      description: 预览版更强能力
      priority: 2
      supports_thinking: true
      config:
        temperature: 0.7
        max_tokens: 8192
        timeout: 120
    retry_config:
      max_retries: 3
      base_delay: 1.0
      max_delay: 10.0
      exponential_backoff: true
fallback_rules:
  within_provider:
    enabled: true
    strategy: key_first
  cross_provider:
    enabled: true
    model_priority_keywords:
    - claude
    - gemini
    - gpt
    - deepseek
    - kimi
    - doubao
    - qwen
task_defaults:
  longform: deepseek-v3
  post: deepseek-v3
  analysis: deepseek-v3
  # Title generation verified against the real structured-output contract.
  # DeepSeek relay currently times out / reports no available channel for titles.
  # Keep other task defaults unchanged; explicit user model overrides still apply.
  title: gemini-pro
  metadata: deepseek-v3
  slack: gemini-pro
